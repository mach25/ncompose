[package]
name = "ncompose"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Docker Compose-like runner for native macOS services with per-service loopback networking"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
# Builds libncompose_shim.dylib next to the test binary, for tests that start services.
ncompose-shim = { path = "../shim" }
