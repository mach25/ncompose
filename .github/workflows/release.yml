# Builds universal (arm64 + x86_64) macOS binaries for a version tag and publishes
# them as a GitHub release:  git tag v0.0.1 && git push origin v0.0.1
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Check the tag matches the crate version
        run: |
          crate=$(cargo pkgid -p ncompose | sed 's/.*[#@]//')
          test "${GITHUB_REF_NAME#v}" = "$crate" || { echo "tag $GITHUB_REF_NAME != crate $crate"; exit 1; }

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p ncompose -p ncompose-shim --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Package
        run: |
          name="ncompose-${GITHUB_REF_NAME#v}-macos-universal"
          mkdir -p "dist/$name/bin" "dist/$name/lib"
          for f in bin/ncompose lib/libncompose_shim.dylib; do
            lipo -create target/{aarch64,x86_64}-apple-darwin/release/$(basename $f) -output "dist/$name/$f"
            codesign --force --sign - "dist/$name/$f"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          lipo -info "dist/$name/bin/ncompose" "dist/$name/lib/libncompose_shim.dylib"
          cat dist/*.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --title "ncompose ${GITHUB_REF_NAME#v}" --generate-notes

      # Points the Homebrew formula at the new release. TAP_DEPLOY_KEY is the private half
      # of a write-enabled deploy key on mach25/homebrew-ncompose.
      - name: Update the Homebrew formula
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::error::TAP_DEPLOY_KEY is not set; update Formula/ncompose.rb in mach25/homebrew-ncompose by hand"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          name="ncompose-$version-macos-universal"
          sha=$(cut -d' ' -f1 "dist/$name.tar.gz.sha256")
          key="$RUNNER_TEMP/tap_key"
          (umask 077 && printf '%s\n' "$TAP_DEPLOY_KEY" > "$key")
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:mach25/homebrew-ncompose.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' -E \
            -e "s|^  url \".*\"|  url \"https://github.com/mach25/ncompose/releases/download/$GITHUB_REF_NAME/$name.tar.gz\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$sha\"|" \
            Formula/ncompose.rb
          git diff
          if git diff --quiet; then
            echo "formula already points at $version"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "ncompose $version"
          git push origin HEAD:main
          rm -f "$key"
